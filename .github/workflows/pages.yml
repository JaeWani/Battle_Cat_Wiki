name: Verify and deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Collect current Korean official event notices
        continue-on-error: true
        run: python3 scripts/collect-events.py
      - name: Restore byte-identical game artwork
        run: npm run assets
      - name: Test calculation engine
        run: npm test
      - name: Validate numerical data and original image checksums
        run: npm run check
      - name: Verify live community API and authentication boundaries
        run: npm run check:community
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish prototype
        id: deployment
        uses: actions/deploy-pages@v4
